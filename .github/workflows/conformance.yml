name: Conformance

on:
  workflow_dispatch:
    inputs:
      minifier:
        description: CSS minifier to run against the WPT corpus
        required: true
        type: choice
        options:
          - minifypp
          - lightningcss
        default: minifypp
      limit:
        description: Maximum WPT CSS cases to extract (0 = all)
        required: true
        default: "0"
      publish:
        description: Publish the completed static dashboard to main
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: minify-conformance
  cancel-in-progress: false

jobs:
  css-wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINIFIER: ${{ github.event_name == 'schedule' && 'minifypp' || inputs.minifier }}
    steps:
      - name: Checkout conformance source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: stage
      - name: Reject non-legacy @pathto usage
        shell: bash
        run: |
          set -euo pipefail
          if { grep -rn "@pathto(" templates content HANDOVER.md 2>/dev/null; \
               grep -rn "@pathto(" .github 2>/dev/null | grep -v "conformance.yml"; }; then
            echo "FAIL: non-legacy @pathto( found in active dashboard sources" >&2
            exit 1
          fi

      - name: Checkout Minify++
        if: env.MINIFIER == 'minifypp'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: minify-cx/minify
          path: minify-source
          ref: 4866db785c78abb564697ade821d0e4425b89364

      - name: Build Minify++
        if: env.MINIFIER == 'minifypp'
        working-directory: minify-source
        run: make

      - name: Install pinned Lightning CSS CLI
        if: env.MINIFIER == 'lightningcss'
        shell: bash
        run: |
          npm install --global lightningcss-cli@1.33.0
          lightningcss --version

      - name: Verify browser availability
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium

      - name: Acquire WPT and record exact revision
        run: python3 tools/conformance.py sync wpt

      - name: Extract CSS corpus
        shell: bash
        run: |
          limit='${{ inputs.limit }}'
          if [[ -n "$limit" && "$limit" != 0 ]]; then
            python3 tools/conformance.py extract-css --limit "$limit"
          else
            python3 tools/conformance.py extract-css
          fi

      - name: Run selected minifier against WPT CSS
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MINIFIER" == "lightningcss" ]]; then
            python3 tools/conformance.py run-css \
              --cases work/wpt-css.jsonl \
              --minifier lightningcss \
              --minify-bin "$(command -v lightningcss)" \
              --browser-timeout 120
          else
            python3 tools/conformance.py run-css \
              --cases work/wpt-css.jsonl \
              --minifier minifypp \
              --minify-bin "$GITHUB_WORKSPACE/minify-source/minify" \
              --browser-timeout 120
          fi

      - name: Build pinned Nift 4.0.12 candidate
        shell: bash
        run: |
          set -euo pipefail
          # The dashboard templates use canonical @path, which requires the
          # reviewed 4.0.12 candidate; older released Nift parses @pathto, not
          # @path. Build from the pinned reviewed commit until 4.0.12 is released.
          git clone --quiet https://github.com/nift-dev/nift.git nift-candidate
          git -C nift-candidate checkout --quiet 77e44d15e43f0936876107c4df1fa6a5b8220be4
          make -C nift-candidate -j2 >/dev/null
          test "$(nift-candidate/nift --version)" = "Nift v4.0.12" \
            || { echo "FAIL: candidate Nift version is not v4.0.12" >&2; exit 1; }
          echo "$PWD/nift-candidate" >> "$GITHUB_PATH"

      - name: Checkout generated main branch into public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf public
          git clone --quiet --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" public

      - name: Bake completed result into static dashboard
        run: python3 tools/conformance.py dashboard --require-minifier-commit 4866db785c78abb564697ade821d0e4425b89364

      - name: Upload machine-readable evidence and generated dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: minify-conformance-results-${{ env.MINIFIER }}
          path: |
            results/
            public/

      - name: Publish completed dashboard to main
        if: github.event_name == 'schedule' || inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("results/latest.json").read_text())
          counts = d.get("summary", {}).get("counts", {})
          unverified = counts.get("unverified", 0)
          browser_error = (d.get("browser") or {}).get("error")
          if unverified:
              sys.exit(f"Refusing to publish: {unverified} unverified cases (browser oracle incomplete)")
          if browser_error:
              sys.exit("Refusing to publish: browser oracle error present")
          PY
          git -C public config user.name github-actions[bot]
          git -C public config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C public add -A
          if git -C public diff --cached --quiet; then
            echo "Dashboard unchanged; nothing to publish."
            exit 0
          fi
          git -C public commit -m "Publish conformance dashboard ${GITHUB_SHA::12}"
          git -C public push origin main
